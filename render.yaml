services:
  - type: web
    name: busca-no-maps
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 app:app
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_USERNAME
        value: ensinoplus
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_SECURE_COOKIES
        value: "1"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: LEADS_DB_PATH
        value: /tmp/leads.db
