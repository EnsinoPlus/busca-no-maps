name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt ruff pip-audit
      - run: ruff check app.py database.py email_finder.py iniciar.py main.py places_api.py tests
      - run: pip-audit -r requirements.txt
      - run: pytest tests -q
